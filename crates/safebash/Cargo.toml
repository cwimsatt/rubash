[package]
name = "safebash"
version = "0.1.0"
edition = "2021"
description = "A bash-compatible shell (rubash engine) with built-in LLM-agent safety checks"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "safebash"
path = "src/main.rs"

[dependencies]
rubash = { path = "../.." }
safebash-guard = { path = "../safebash-guard" }
serde_json = "1"
# safebash keystone: pinned to the owner's brush fork, which adds the source
# span of the I/O redirect operator to IoRedirect (brush fork DESIGN rev 2), so
# the converter reconstructs `{fd}>file` adjacency instead of denying it. The
# Peg path is the default (the winnow-parser feature is left off). Exact commit
# pin for reproducibility; update it when the fork advances.
brush-parser = { git = "https://github.com/cwimsatt/brush.git", rev = "2ce8c10dc4de97462ce7f5f01d4606fb14feef27" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
