[package]
name = "safebash"
version = "0.1.0"
edition = "2021"
description = "A bash-compatible shell (rubash engine) with built-in LLM-agent safety checks"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "safebash"
path = "src/main.rs"

[dependencies]
rubash = { path = "../.." }
safebash-guard = { path = "../safebash-guard" }
serde_json = "1"
# safebash keystone A1 (offline parity path only; the live guard keeps
# RubashParser - see src/brush_convert.rs and src/bin/brush_parity.rs).
# Exact pin per DESIGN.md Section 6; the Peg path is the default (the
# winnow-parser feature is left off). Confirm the published 0.4.0 contents
# against inspected commit b4fb2dbab3ff499d1bf149c0b03a60e9fe500a2a.
brush-parser = "=0.4.0"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
