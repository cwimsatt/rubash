[package]
name = "safebash"
version = "0.1.0"
edition = "2021"
description = "A bash-compatible shell (rubash engine) with built-in LLM-agent safety checks"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "safebash"
path = "src/main.rs"

[dependencies]
rubash = { path = "../.." }
safebash-guard = { path = "../safebash-guard" }
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
